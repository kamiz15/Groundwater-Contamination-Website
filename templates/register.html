<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | CAST Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Create Account</h2>
        <p class="login-subtitle">Join the CAST platform to access your dashboard ⚙️</p>

        <form id="registerForm">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="reg_username">Username</label>
                <input type="text" id="reg_username" name="username" placeholder="Your full name" required>
            </div>

            <div class="form-group">
                <label for="reg_email">Email</label>
                <input type="email" id="reg_email" name="email" placeholder="example@university.edu" required>
            </div>

            <div class="form-group">
                <label for="reg_password">Password</label>
                <input type="password" id="reg_password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="reg_confirm">Confirm Password</label>
                <input type="password" id="reg_confirm" name="confirmPassword" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn-primary">Sign Up</button>

            <div id="registerMessage"></div>

            <p class="no-account">
                Already have an account? <a href="{{ url_for('login_page') }}">Login</a>
            </p>
        </form>
    </div>
</body>
</html>
