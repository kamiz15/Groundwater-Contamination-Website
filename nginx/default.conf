map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 50m;

    # Compress text responses (HTML is compressed by default when gzip is on).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    # Baseline security headers. HSTS is intentionally NOT set here: add it on
    # the TLS-terminating front proxy once HTTPS is in place.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Behind an institutional front proxy (Tuebingen / IIT Delhi) ---
    # When a campus TLS proxy sits in front of this nginx, $remote_addr is the
    # proxy's address, so every visitor would share one rate-limit bucket and
    # lock each other out. Uncomment and set the front proxy's IP/CIDR so the
    # real client IP is restored from X-Forwarded-For:
    #
    # set_real_ip_from 10.0.0.0/8;        # <- front proxy address or CIDR
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Flask-rendered Bokeh pages can reference Panel's browser extensions from
    # the root static path. Keep that narrow Panel-owned subtree on the Panel
    # service while leaving the rest of /static/ to Flask.
    location /static/extensions/panel/ {
        set $panel_upstream panel:5007;
        proxy_pass http://$panel_upstream/panel$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /panel;
    }

    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # add_header at location level discards server-level headers; restate them.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /auth/check {
        internal;
        set $flask_upstream flask:5000;
        proxy_pass http://$flask_upstream/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @login_redirect {
        return 302 /login;
    }

    location /panel/ {
        set $panel_upstream panel:5007;
        auth_request /auth/check;
        error_page 401 = @login_redirect;

        # Capture the caller's identity from the auth subrequest and forward it
        # as a trusted header. proxy_set_header overwrites anything the client
        # tried to send, so the Panel app cannot be tricked into loading another
        # user's data via a forged ?email= or X-Auth-Email.
        #
        # /auth/check admits guests (the model pages need no account) and names
        # them by their per-session guest id, so the subrequest only 401s if the
        # Flask app itself is unreachable.
        auth_request_set $auth_email $upstream_http_x_user_email;

        proxy_pass http://$panel_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header X-Auth-Email $auth_email;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /panel;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        set $flask_upstream flask:5000;
        proxy_pass http://$flask_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
