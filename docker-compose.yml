# Cap per-container logs: bounds disk use and IP-address retention (access
# logs are personal data under GDPR/DPDP).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      flask:
        condition: service_healthy
      panel:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  flask:
    build: .
    command: gunicorn --workers 4 --timeout 120 --access-logfile - --bind 0.0.0.0:5000 app:app
    env_file:
      - .env.docker
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      # Queue DB, results, and report metadata live on the named volume below
      # so queued jobs and downloadable reports survive redeploys.
      NUMERICAL_JOB_ROOT: /data/numerical_jobs
      # Solver scratch files are ephemeral; keep them off the image layer.
      NUMERICAL_RUN_ROOT: /tmp/numerical_runs
    volumes:
      - numerical_jobs:/data/numerical_jobs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  panel:
    build: .
    command: python panel_server.py
    env_file:
      - .env.docker
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      NUMERICAL_JOB_ROOT: /data/numerical_jobs
    volumes:
      - numerical_jobs:/data/numerical_jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/panel/panel_liedl_single', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    logging: *default-logging

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cast_project}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_setup.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql_data:
  numerical_jobs:
